syntax = "proto3";

package auth;

option go_package = "github.com/MaksimCpp/Food/auth/authpb";

service AuthService {
    rpc RegisterUser(RegisterRequest)
        returns (RegisterResponse);

    rpc RegisterAdmin(RegisterAdminRequest)
        returns (RegisterResponse);

    rpc RegisterCourier(RegisterRequest)
        returns (RegisterResponse);

    rpc LoginUser(LoginRequest)
        returns (LoginResponse);

    rpc LoginAdmin(LoginAdminRequest)
        returns (LoginResponse);

    rpc LoginCourier(LoginRequest)
        returns (LoginResponse);

    rpc Refresh(RefreshRequest)
        returns (RefreshResponse);

    rpc ValidateAccessToken(ValidateRequest)
        returns (ValidateResponse);
}

message RegisterRequest {
    string username = 1;
    string email = 2;
    string password = 3;
}

message RegisterAdminRequest {
    string username = 1;
    string email = 2;
    string password = 3;
    string admin_code = 4;
}

message RegisterResponse {
    int64 user_id = 1;
    string email = 2;
}


message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginAdminRequest {
    string email = 1;
    string password = 2;
    string admin_code = 3;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message RefreshRequest {
    string refresh_token = 1;
}

message RefreshResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message ValidateRequest {
    string access_token = 1;
}

message ValidateResponse {
    int64 user_id = 1;
    string role = 2;
}